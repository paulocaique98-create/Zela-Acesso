name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, format, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Auditoria de dependencias (alta/critica falha o build)
        run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  database-and-e2e:
    name: RLS (pgTAP), drift RBAC, build, E2E
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - name: Chave sintetica de assinatura de comando (D-022; so do runner efemero)
        run: |
          JWK=$(node scripts/command-key.mjs gen-signing | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).jwk')
          echo "COMMAND_SIGNING_JWK=$JWK" >> "$GITHUB_ENV"
      - name: Supabase local (project_id zela-acesso-local, portas 553xx)
        run: node scripts/supabase-local.mjs start
        env:
          ZELA_EDGE_RUNTIME: '1'
          # Chave sintetica so do runner efemero (secret do edge-gateway); nunca usar em ambiente real.
          COMMAND_MASTER_KEY: c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1
      - name: Migrations limpas + testes de RLS
        run: |
          node scripts/supabase-local.mjs reset
          node scripts/supabase-local.mjs test
      - name: Seed sintetico e drift RBAC
        run: |
          node scripts/seed-dev.mjs
          node scripts/check-rbac-drift.mjs
      - name: E2E do Edge Agent com a nuvem (edge-gateway, ingestao, atuacao)
        run: node apps/edge-agent/e2e/cloud-slice.e2e.mjs
      - name: E2E do terminal Standalone simulado (roster, pessoa na evidência, alarme de porta)
        run: node apps/edge-agent/e2e/device-alarm.e2e.mjs
      - name: E2E do comando remoto de abertura (gateway assina, agente verifica e abre)
        run: node apps/edge-agent/e2e/device-command.e2e.mjs
        env:
          COMMAND_MASTER_KEY: c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1
      - name: E2E da chave do dispositivo e comando v2 (enrollment, prova de posse, kid)
        run: node apps/edge-agent/e2e/device-key.e2e.mjs
      - name: E2E da eliminação biométrica (revogar, Edge apaga, confirmação, erased)
        run: node apps/edge-agent/e2e/biometric-erasure.e2e.mjs
      - name: Env publico, build e varredura de segredos no bundle
        run: |
          node scripts/write-web-env.mjs
          pnpm build
          node scripts/check-bundle-secrets.mjs
      - name: E2E (Playwright)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test
      - name: Encerrar Supabase local
        if: always()
        run: node scripts/supabase-local.mjs stop
